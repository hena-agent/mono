name: Run OpenCode
description: Restore selected OpenCode auth, install a pinned CLI, and run a GitHub agent or trusted command.

inputs:
  model:
    description: Provider/model id
    required: true
  variant:
    description: Model variant for reasoning effort or thinking budget
    required: true
  opencode-auth-json:
    description: Shared CI credential store
    required: true
  opencode-version:
    description: Optional exact OpenCode CLI version override
    required: false
    default: ""
  timeout-minutes:
    description: Calling job timeout; OAuth leases must outlive it by 10 minutes
    required: true
  github-token:
    description: Write-scoped token used to publish comments and reviews
    required: true
  review-token:
    description: Read-only token used to collect pull request review context
    required: true
  prompt:
    description: Final prompt passed to opencode github run
    required: false
    default: ""
  command:
    description: Trusted review command passed to opencode run --command
    required: false
    default: ""
  command-arguments:
    description: Arguments passed to the slash command
    required: false
    default: ""
  review-directory:
    description: Credential-free pull request checkout used as review data
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate OpenCode invocation
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        COMMAND: ${{ inputs.command }}
        REVIEW_DIRECTORY: ${{ inputs.review-directory }}
      run: |
        set -euo pipefail
        if [ -n "$PROMPT" ] && [ -n "$COMMAND" ]; then
          echo "::error::prompt and command are mutually exclusive."
          exit 1
        fi
        if [ -z "$PROMPT" ] && [ -z "$COMMAND" ]; then
          echo "::error::either prompt or command is required."
          exit 1
        fi
        if [ -n "$COMMAND" ] && [ "$COMMAND" != "thermo-nuclear-code-quality-review" ]; then
          echo "::error::unsupported slash command '$COMMAND'."
          exit 1
        fi
        if [ -n "$COMMAND" ] && [ "$GITHUB_EVENT_NAME" != "pull_request_target" ]; then
          echo "::error::Review commands require a trusted pull_request_target workflow."
          exit 1
        fi
        if [ -n "$COMMAND" ] && [ "$REVIEW_DIRECTORY" != ".opencode-review-target" ]; then
          echo "::error::Review commands require the isolated .opencode-review-target checkout."
          exit 1
        fi
        if [ -n "$COMMAND" ]; then
          BASE_SHA=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
          HEAD_SHA=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error::Review commands require pull request base and head commits."
            exit 1
          fi
          if [ -z "${GITHUB_WORKFLOW_SHA:-}" ]; then
            echo "::error::Review commands require the trusted workflow commit."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_WORKFLOW_SHA" ]; then
            echo "::error::The workflow checkout does not match the trusted workflow commit."
            exit 1
          fi
          if [ "$(git -C "$REVIEW_DIRECTORY" rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::The review checkout does not match the pull request head commit."
            exit 1
          fi
        fi

    - name: Set up OpenCode
      uses: ./.github/actions/setup-opencode
      with:
        model: ${{ inputs.model }}
        variant: ${{ inputs.variant }}
        command: ${{ inputs.command }}
        opencode-auth-json: ${{ inputs.opencode-auth-json }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        opencode-version: ${{ inputs.opencode-version }}

    - name: Run OpenCode command
      if: inputs.command != ''
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        VARIANT: ${{ inputs.variant }}
        COMMAND: ${{ inputs.command }}
        COMMAND_ARGUMENTS: ${{ inputs.command-arguments }}
        REVIEW_DIRECTORY: ${{ inputs.review-directory }}
        GH_TOKEN: ${{ inputs.review-token }}
        OPENCODE_DISABLE_CLAUDE_CODE: "1"
        OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
        OPENCODE_DISABLE_PROJECT_CONFIG: "1"
      run: |
        set -euo pipefail
        if ! [[ "$COMMAND_ARGUMENTS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::$COMMAND requires one pull request number, got '$COMMAND_ARGUMENTS'."
          exit 1
        fi

        REVIEW_CONTEXT="$RUNNER_TEMP/opencode-review-context"
        install -d -m 700 "$REVIEW_CONTEXT/bin"
        BASE_SHA=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")

        gh pr view "$COMMAND_ARGUMENTS" > "$REVIEW_CONTEXT/view"
        if ! gh pr diff "$COMMAND_ARGUMENTS" > "$REVIEW_CONTEXT/diff" 2> "$REVIEW_CONTEXT/diff-error"; then
          DIFF_ERROR=$(<"$REVIEW_CONTEXT/diff-error")
          if [[ "$DIFF_ERROR" != *"HTTP 406"* ]]; then
            printf '%s\n' "$DIFF_ERROR" >&2
            exit 1
          fi

          echo "::notice::GitHub could not render this PR's diff; using the local merge-base diff."
          HEAD_SHA=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          MERGE_BASE_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            --jq '.merge_base_commit.sha')
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$GIT_AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$MERGE_BASE_SHA" "$HEAD_SHA"
          unset GIT_AUTH_HEADER
          git diff --no-ext-diff --find-renames "$MERGE_BASE_SHA" "$HEAD_SHA" > "$REVIEW_CONTEXT/diff"
        fi

        # These variables expand when OpenCode invokes the generated wrapper.
        # shellcheck disable=SC2016
        printf '%s\n' \
          '#!/usr/bin/env bash' \
          'set -euo pipefail' \
          'if [ "$#" -ne 3 ] || [ "$1" != "pr" ] || [ "$3" != "$OPENCODE_REVIEW_PR" ]; then' \
          '  echo "Only the configured PR view and diff commands are available." >&2' \
          '  exit 1' \
          'fi' \
          'case "$2" in' \
          '  view) cat "$OPENCODE_REVIEW_VIEW" ;;' \
          '  diff) cat "$OPENCODE_REVIEW_DIFF" ;;' \
          '  *) echo "Only PR view and diff are available." >&2; exit 1 ;;' \
          'esac' \
          > "$REVIEW_CONTEXT/bin/gh"
        chmod 700 "$REVIEW_CONTEXT/bin/gh"

        OPENCODE_PERMISSION=$(jq -cn --arg pr "$COMMAND_ARGUMENTS" '
          {
            edit: "deny",
            external_directory: "deny",
            bash: {
              "*": "deny",
              ("gh pr view " + $pr): "allow",
              ("gh pr diff " + $pr): "allow"
            },
            question: "deny",
            todowrite: "deny"
          }
        ')
        export OPENCODE_PERMISSION

        export OPENCODE_REVIEW_PR="$COMMAND_ARGUMENTS"
        export OPENCODE_REVIEW_VIEW="$REVIEW_CONTEXT/view"
        export OPENCODE_REVIEW_DIFF="$REVIEW_CONTEXT/diff"
        export PATH="$REVIEW_CONTEXT/bin:$PATH"
        git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
        unset GH_TOKEN
        cd "$REVIEW_DIRECTORY"

        COMMAND_STATUS=0
        opencode run \
          --command "$COMMAND" \
          --model "$MODEL" \
          --variant "$VARIANT" \
          --format json \
          "$COMMAND_ARGUMENTS" \
          | tee "$RUNNER_TEMP/opencode-command.ndjson" \
          || COMMAND_STATUS=$?

        if [ "$COMMAND_STATUS" -eq 0 ]; then
          jq -jrs \
            --arg operation "final-text" \
            --arg command "$COMMAND" \
            -f "$GITHUB_WORKSPACE/.github/actions/setup-opencode/extract-result.jq" \
            "$RUNNER_TEMP/opencode-command.ndjson" \
            > "$RUNNER_TEMP/opencode-command-result.md"
          exit 0
        fi

        if jq -jers \
          --arg operation "completed-review" \
          --arg command "$COMMAND" \
          -f "$GITHUB_WORKSPACE/.github/actions/setup-opencode/extract-result.jq" \
          "$RUNNER_TEMP/opencode-command.ndjson" \
          > "$RUNNER_TEMP/opencode-command-result.md"; then
          echo "::notice::Publishing the completed review task after a retryable final provider error."
          exit 0
        fi

        exit "$COMMAND_STATUS"

    - name: Publish OpenCode review
      if: inputs.command != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MODEL: ${{ inputs.model }}
        VARIANT: ${{ inputs.variant }}
        OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
      run: |
        set -euo pipefail
        PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
        HEAD_SHA=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
        BASE_SHA=$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
        read -r CURRENT_HEAD CURRENT_BASE < <(
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.head.sha, .base.sha] | @tsv'
        )
        if [ "$CURRENT_HEAD" != "$HEAD_SHA" ] || [ "$CURRENT_BASE" != "$BASE_SHA" ]; then
          echo "::notice::Skipping stale review for base/head $BASE_SHA/$HEAD_SHA; pull request now points to $CURRENT_BASE/$CURRENT_HEAD."
          exit 0
        fi

        jq -n \
          --arg head "$HEAD_SHA" \
          --arg model "$MODEL" \
          --arg variant "$VARIANT" \
          --arg opencode_version "$OPENCODE_VERSION" \
          --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --arg commit_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$HEAD_SHA" \
          --rawfile review "$RUNNER_TEMP/opencode-command-result.md" \
          -f "$GITHUB_ACTION_PATH/review-payload.jq" \
          > "$RUNNER_TEMP/github-review.json"

        gh api \
          --method POST \
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
          --input "$RUNNER_TEMP/github-review.json"

    - name: Run OpenCode GitHub agent
      if: inputs.command == ''
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        VARIANT: ${{ inputs.variant }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: "true"
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: opencode github run
